<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- POKA 마스코트(불꽃 머리 캐릭터). 앱 아이콘·파비콘·로고의 원본입니다. -->
  <defs>
    <radialGradient id="bgGlow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#3a1210"/>
      <stop offset="1" stop-color="#120b0b"/>
    </radialGradient>
    <linearGradient id="flameOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a2a"/>
      <stop offset="1" stop-color="#d81f1f"/>
    </linearGradient>
    <linearGradient id="flameMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb03a"/>
      <stop offset="1" stop-color="#ff6a1f"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="1" stop-color="#ffc94a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <g transform="translate(256 257) scale(1.06) translate(-256 -235)">
    <!-- 얼굴 -->
    <ellipse cx="256" cy="318" rx="124" ry="102" fill="#fdeee3" stroke="#3a0d0d" stroke-width="12"/>
    <!-- 불꽃 머리(바깥 빨강) -->
    <path fill="url(#flameOuter)" stroke="#3a0d0d" stroke-width="12" stroke-linejoin="round"
      d="M130 322 C114 256 132 214 160 184 C156 214 166 232 180 242 C176 186 198 140 238 106 C232 140 240 166 256 182 C262 136 282 94 268 44 C320 84 340 140 332 190 C348 176 354 150 352 126 C388 164 404 220 388 270 C384 292 384 308 382 322 C356 290 332 272 306 266 C292 282 274 292 256 300 C238 292 220 282 206 266 C180 272 156 290 130 322 Z"/>
    <!-- 가운데 주황 불꽃 -->
    <path fill="url(#flameMid)"
      d="M176 262 C176 222 196 186 226 162 C224 190 234 210 256 226 C262 190 280 156 276 116 C312 150 324 192 318 226 C332 214 340 196 340 178 C362 210 366 244 352 268 C334 262 320 258 306 256 C292 270 274 280 256 286 C238 280 220 270 206 256 C196 256 186 258 176 262 Z"/>
    <!-- 노란 불꽃 심지 -->
    <path fill="url(#flameCore)"
      d="M226 254 C226 228 238 206 254 190 C254 210 262 222 274 232 C282 214 290 196 288 176 C306 200 310 228 302 250 C288 258 272 264 256 268 C244 264 234 260 226 254 Z"/>
    <!-- 눈썹(화난 표정) -->
    <path d="M176 300 L232 320" stroke="#3a0d0d" stroke-width="13" stroke-linecap="round"/>
    <path d="M336 300 L280 320" stroke="#3a0d0d" stroke-width="13" stroke-linecap="round"/>
    <!-- 눈 -->
    <path fill="#5a0f12" d="M184 326 Q212 322 236 338 Q214 360 188 344 Z"/>
    <path fill="#5a0f12" d="M328 326 Q300 322 276 338 Q298 360 324 344 Z"/>
    <circle cx="210" cy="338" r="5" fill="#ffffff"/>
    <circle cx="302" cy="338" r="5" fill="#ffffff"/>
    <!-- 볼 -->
    <ellipse cx="168" cy="370" rx="20" ry="11" fill="#ff7d7d" opacity="0.55"/>
    <ellipse cx="344" cy="370" rx="20" ry="11" fill="#ff7d7d" opacity="0.55"/>
    <!-- 입 -->
    <path d="M238 386 Q256 372 274 386" fill="none" stroke="#5a0f12" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
